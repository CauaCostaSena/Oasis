# ============================================================================
# CKGD - Configuração da aplicação
# ============================================================================

server.port=8080
spring.jackson.deserialization.accept-float-as-int=false

# --- Banco de dados MySQL ---
# Ajuste usuário/senha conforme seu ambiente. O schema "ckgd" deve existir
# (rode database/01_schema.sql, 02_views_routines.sql antes de iniciar).
# Se o seu root do MySQL tiver senha, defina via variável de ambiente CKGD_DB_PASSWORD
# em vez de editar esta linha, para não versionar a senha no Git.
spring.datasource.url=${CKGD_DB_URL:jdbc:mysql://localhost:3306/ckgd?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${CKGD_DB_USER:root}
spring.datasource.password=${CKGD_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" ajuda em desenvolvimento; o schema oficial vem dos scripts em /database
spring.jpa.hibernate.ddl-auto=${CKGD_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# Em produção, defina via variável de ambiente CKGD_JWT_SECRET (>= 32 caracteres)
ckgd.jwt.secret=${CKGD_JWT_SECRET:}
ckgd.jwt.expiration-ms=86400000

# --- Integração GitHub ---
# Sem token: 60 requisições/hora (rate limit público do GitHub).
# Com token (recomendado): 5000 requisições/hora.
# Gere em https://github.com/settings/tokens (sem escopos especiais, apenas leitura pública)
ckgd.github.token=${CKGD_GITHUB_TOKEN:}

# --- Logging ---
logging.level.com.ckgd=INFO
logging.level.org.springframework.security=WARN

# --- Upload de arquivos (foto de perfil da empresa) ---
ckgd.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Origens explicitas do frontend; Bearer nao usa cookies de autenticacao.
ckgd.cors.allowed-origins=${CKGD_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8000,http://127.0.0.1:8000,http://localhost:8090,http://127.0.0.1:8090}
ckgd.plano.gratuito-nome=${CKGD_FREE_PLAN_NAME:Free}
